[build]
  command = "npx vite build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# 单页应用可选：前端路由回退（如果需要）
#[[redirects]]
#  from = "/*"
#  to = "/index.html"
#  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200