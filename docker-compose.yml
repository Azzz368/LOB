version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lob-postgres
    environment:
      POSTGRES_USER: lob
      POSTGRES_PASSWORD: lob
      POSTGRES_DB: lob
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lob-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
